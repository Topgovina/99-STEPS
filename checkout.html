<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>99STEPS — Checkout</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./style.css">

    <style>
        /* ==========================================
           99STEPS CHECKOUT
        ========================================== */

        .checkout-page {
            min-height: 100vh;
            background: var(--cream);
            padding: 110px 6% 80px;
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .checkout-header .logo {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--black);
        }

        .checkout-header h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(42px, 6vw, 70px);
            margin-bottom: 12px;
        }

        .checkout-header p {
            color: var(--gray);
        }

        .checkout-layout {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            gap: 70px;
            align-items: start;
        }

        .checkout-section {
            background: #fff;
            padding: 35px;
            border: 1px solid var(--line);
            margin-bottom: 25px;
        }

        .checkout-section h2 {
            font-family: "Playfair Display", serif;
            font-size: 26px;
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--line);
            background: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--gold);
        }

        .payment-options {
            display: grid;
            gap: 12px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--line);
            padding: 17px;
            cursor: pointer;
            transition: .2s ease;
        }

        .payment-option:hover {
            border-color: var(--gold);
        }

        .payment-option input {
            accent-color: var(--gold);
        }

        .payment-option strong {
            font-size: 14px;
        }

        .payment-option p {
            margin-top: 4px;
            color: var(--gray);
            font-size: 12px;
        }

        /* ==========================================
           ORDER SUMMARY
        ========================================== */

        .order-box {
            background: var(--black);
            color: white;
            padding: 35px;
            position: sticky;
            top: 110px;
        }

        .order-box h2 {
            font-family: "Playfair Display", serif;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .checkout-items {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .checkout-item {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .checkout-item img {
            width: 75px;
            height: 90px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .checkout-item-info {
            flex: 1;
        }

        .checkout-item-info h3 {
            font-size: 13px;
            margin-bottom: 6px;
        }

        .checkout-item-info p {
            color: #aaa;
            font-size: 12px;
            line-height: 1.6;
        }

        .checkout-item-price {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .order-line {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-top: 1px solid #333;
            font-size: 13px;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
            margin-top: 10px;
            border-top: 1px solid #555;
            font-size: 18px;
            font-weight: 700;
        }

        .pay-btn {
            width: 100%;
            border: none;
            background: var(--gold);
            color: var(--black);
            padding: 18px;
            margin-top: 30px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: .3s ease;
        }

        .pay-btn:hover:not(:disabled) {
            background: var(--gold-light);
        }

        .pay-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .secure-note {
            text-align: center;
            color: #999;
            font-size: 11px;
            margin-top: 18px;
            line-height: 1.5;
        }

        /* ==========================================
           EMPTY CHECKOUT
        ========================================== */

        .empty-checkout {
            max-width: 500px;
            margin: 120px auto;
            text-align: center;
        }

        .empty-checkout h2 {
            font-family: "Playfair Display", serif;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .empty-checkout p {
            color: var(--gray);
            margin-bottom: 25px;
        }

        /* ==========================================
           PAYMENT STATUS
        ========================================== */

        .payment-status {
            max-width: 650px;
            margin: 80px auto;
            background: #fff;
            border: 1px solid var(--line);
            padding: 55px 35px;
            text-align: center;
        }

        .payment-status .status-mark {
            width: 65px;
            height: 65px;
            margin: 0 auto 25px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .payment-status h2 {
            font-family: "Playfair Display", serif;
            font-size: 36px;
            margin-bottom: 15px;
        }

        .payment-status p {
            color: var(--gray);
            line-height: 1.7;
        }

        .payment-reference {
            margin-top: 20px;
            padding: 15px;
            background: var(--cream);
            font-size: 12px;
            word-break: break-all;
        }

        .payment-status .return-btn {
            display: inline-block;
            margin-top: 25px;
            background: var(--black);
            color: #fff;
            padding: 15px 25px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        @media (max-width: 900px) {

            .checkout-layout {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .order-box {
                position: static;
            }
        }

        @media (max-width: 600px) {

            .checkout-page {
                padding: 80px 20px 50px;
            }

            .checkout-section {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .order-box {
                padding: 25px 20px;
            }

            .checkout-item {
                align-items: flex-start;
            }

            .checkout-item img {
                width: 65px;
                height: 80px;
            }

            .checkout-item-price {
                font-size: 12px;
            }

            .payment-status {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

<div class="checkout-page">

    <div class="checkout-header">

        <a href="./index.html" class="logo">
            99<span>STEPS</span>
        </a>

        <h1>CHECKOUT</h1>

        <p>Complete your order and step into the house.</p>

    </div>


    <div id="checkoutContent">

        <div class="checkout-layout">

            <!-- ==========================================
                 CUSTOMER DETAILS
            ========================================== -->

            <div>

                <section class="checkout-section">

                    <h2>Contact Information</h2>

                    <div class="form-group">

                        <label for="customerEmail">
                            EMAIL ADDRESS
                        </label>

                        <input
                            type="email"
                            id="customerEmail"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </section>


                <!-- ==========================================
                     DELIVERY
                ========================================== -->

                <section class="checkout-section">

                    <h2>Delivery Details</h2>

                    <div class="form-row">

                        <div class="form-group">

                            <label for="firstName">
                                FIRST NAME
                            </label>

                            <input
                                type="text"
                                id="firstName"
                                autocomplete="given-name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="lastName">
                                LAST NAME
                            </label>

                            <input
                                type="text"
                                id="lastName"
                                autocomplete="family-name"
                                required
                            >

                        </div>


                        <div class="form-group full">

                            <label for="phone">
                                PHONE NUMBER
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="024 XXX XXXX"
                                autocomplete="tel"
                                required
                            >

                        </div>


                        <div class="form-group full">

                            <label for="address">
                                DELIVERY ADDRESS
                            </label>

                            <input
                                type="text"
                                id="address"
                                placeholder="House number, street, area"
                                autocomplete="street-address"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="city">
                                CITY
                            </label>

                            <select id="city" required>

                                <option value="">
                                    Select city
                                </option>

                                <option>Accra</option>
                                <option>Tema</option>
                                <option>Kasoa</option>
                                <option>East Legon</option>
                                <option>Madina</option>
                                <option>Adenta</option>
                                <option>Spintex</option>
                                <option>Other</option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="region">
                                REGION
                            </label>

                            <select id="region" required>

                                <option value="">
                                    Select region
                                </option>

                                <option>Greater Accra</option>
                                <option>Ashanti</option>
                                <option>Western</option>
                                <option>Central</option>
                                <option>Eastern</option>
                                <option>Volta</option>
                                <option>Other</option>

                            </select>

                        </div>

                    </div>

                </section>


                <!-- ==========================================
                     PAYMENT
                ========================================== -->

                <section class="checkout-section">

                    <h2>Payment Method</h2>

                    <div class="payment-options">

                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="mobile-money"
                                checked
                            >

                            <div>

                                <strong>
                                    Mobile Money
                                </strong>

                                <p>
                                    MTN MoMo / Telecel Cash / AT Money
                                </p>

                            </div>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="card"
                            >

                            <div>

                                <strong>
                                    Debit / Credit Card
                                </strong>

                                <p>
                                    Visa / Mastercard
                                </p>

                            </div>

                        </label>

                    </div>

                </section>

            </div>


            <!-- ==========================================
                 ORDER SUMMARY
            ========================================== -->

            <aside class="order-box">

                <h2>Your Order</h2>

                <div
                    class="checkout-items"
                    id="checkoutItems"
                ></div>


                <div class="order-line">

                    <span>SUBTOTAL</span>

                    <span id="checkoutSubtotal">
                        GH₵0
                    </span>

                </div>


                <div class="order-line">

                    <span>DELIVERY</span>

                    <span id="deliveryFee">
                        GH₵0
                    </span>

                </div>


                <div class="order-total">

                    <span>TOTAL</span>

                    <span id="checkoutTotal">
                        GH₵0
                    </span>

                </div>


                <button
                    type="button"
                    class="pay-btn"
                    id="payBtn"
                >
                    FA SIKA NO BRA
                </button>

                <p class="secure-note">
                    🔒 Secure checkout · Your information is protected.
                </p>

            </aside>

        </div>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", () => {

    /* ==========================================
       ELEMENTS
    ========================================== */

    const checkoutContent =
        document.getElementById("checkoutContent");

    const checkoutItems =
        document.getElementById("checkoutItems");

    const checkoutSubtotal =
        document.getElementById("checkoutSubtotal");

    const deliveryFee =
        document.getElementById("deliveryFee");

    const checkoutTotal =
        document.getElementById("checkoutTotal");

    const payBtn =
        document.getElementById("payBtn");


    /* ==========================================
       CART
    ========================================== */

    let cart =
        JSON.parse(
            localStorage.getItem("99stepsCart")
        ) || [];


    /* ==========================================
       FORMAT MONEY
    ========================================== */

    function formatPrice(amount) {

        const number = Number(amount);

        return `GH₵${number.toLocaleString("en-GH", {
            minimumFractionDigits:
                number % 1 !== 0 ? 2 : 0,
            maximumFractionDigits: 2
        })}`;

    }


    /* ==========================================
       CALCULATE TOTALS
    ========================================== */

    function calculateTotals() {

        const subtotal =
            cart.reduce(
                (sum, item) =>
                    sum +
                    Number(item.price) *
                    Number(item.quantity),
                0
            );

        const delivery =
            subtotal >= 500 ? 0 : 30;

        const total =
            subtotal + delivery;

        return {
            subtotal,
            delivery,
            total
        };

    }


    /* ==========================================
       RENDER CHECKOUT
    ========================================== */

    function renderCheckout() {

        if (cart.length === 0) {

            checkoutContent.innerHTML = `

                <div class="empty-checkout">

                    <h2>Your bag is empty.</h2>

                    <p>
                        There are no items waiting for checkout.
                    </p>

                    <a
                        href="./shop.html"
                        class="gold-btn"
                    >
                        RETURN TO COLLECTION
                    </a>

                </div>

            `;

            return;

        }


        checkoutItems.innerHTML = "";


        cart.forEach(item => {

            const product =
                document.createElement("div");

            product.className =
                "checkout-item";


            const colorText =
                item.color
                    ? ` · Color: ${item.color}`
                    : "";


            product.innerHTML = `

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="checkout-item-info">

                    <h3>
                        ${item.name}
                    </h3>

                    <p>
                        Size: ${item.size}${colorText}
                        <br>
                        Qty: ${item.quantity}
                    </p>

                </div>

                <span class="checkout-item-price">
                    ${formatPrice(
                        Number(item.price) *
                        Number(item.quantity)
                    )}
                </span>

            `;


            checkoutItems.appendChild(product);

        });


        const {
            subtotal,
            delivery,
            total
        } = calculateTotals();


        checkoutSubtotal.textContent =
            formatPrice(subtotal);


        deliveryFee.textContent =
            delivery === 0
                ? "FREE"
                : formatPrice(delivery);


        checkoutTotal.textContent =
            formatPrice(total);

    }


    /* ==========================================
       SHOW PAYMENT STATUS
    ========================================== */

    function showPaymentStatus(
        title,
        message,
        reference = "",
        success = true
    ) {

        checkoutContent.innerHTML = `

            <div class="payment-status">

                <div class="status-mark">
                    ${success ? "✓" : "!"}
                </div>

                <h2>
                    ${title}
                </h2>

                <p>
                    ${message}
                </p>

                ${
                    reference
                        ? `
                            <div class="payment-reference">
                                <strong>REFERENCE</strong>
                                <br>
                                ${reference}
                            </div>
                        `
                        : ""
                }

                <a
                    href="./shop.html"
                    class="return-btn"
                >
                    RETURN TO 99STEPS
                </a>

            </div>

        `;

    }


    /* ==========================================
       HANDLE PAYSTACK RETURN
    ========================================== */

    async function handlePaymentReturn() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const reference =
            params.get("reference");


        if (!reference) {
            return false;
        }


        checkoutContent.innerHTML = `

            <div class="payment-status">

                <div class="status-mark">
                    ...
                </div>

                <h2>
                    VERIFYING PAYMENT
                </h2>

                <p>
                    Please wait while we confirm your
                    99STEPS payment.
                </p>

            </div>

        `;


        try {

            const response =
                await fetch(
                    `/api/paystack/verify/${encodeURIComponent(reference)}`
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success ||
                data.status !== "success"
            ) {

                showPaymentStatus(
                    "PAYMENT NOT CONFIRMED",
                    data.message ||
                    "We could not confirm this payment. Please contact 99STEPS if you believe you were charged.",
                    reference,
                    false
                );

                return true;

            }


            /*
             * Payment has been confirmed by Paystack.
             * Only now do we clear the cart.
             */

            localStorage.removeItem("99stepsCart");

            cart = [];


            showPaymentStatus(
                "ORDER CONFIRMED",
                "Your payment has been successfully verified. Your 99STEPS order is now confirmed.",
                data.reference,
                true
            );


            return true;


        } catch (error) {

            console.error(
                "Verification error:",
                error
            );


            showPaymentStatus(
                "VERIFICATION ERROR",
                "We could not verify the payment right now. Please do not pay again until the transaction has been checked.",
                reference,
                false
            );


            return true;

        }

    }


    /* ==========================================
       START PAYMENT
    ========================================== */

    async function startPayment() {

        if (!cart.length) {

            alert(
                "Your bag is empty."
            );

            return;

        }


        const requiredFields = [

            "customerEmail",
            "firstName",
            "lastName",
            "phone",
            "address",
            "city",
            "region"

        ];


        for (
            const fieldId of requiredFields
        ) {

            const field =
                document.getElementById(
                    fieldId
                );


            if (
                !field ||
                !field.value.trim()
            ) {

                field?.focus();

                alert(
                    "Please complete all delivery details."
                );

                return;

            }

        }


        const email =
            document
                .getElementById("customerEmail")
                .value
                .trim();


        const firstName =
            document
                .getElementById("firstName")
                .value
                .trim();


        const lastName =
            document
                .getElementById("lastName")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const address =
            document
                .getElementById("address")
                .value
                .trim();


        const city =
            document
                .getElementById("city")
                .value;


        const region =
            document
                .getElementById("region")
                .value;


        const payment =
            document.querySelector(
                'input[name="payment"]:checked'
            )?.value;


        const {
            total
        } = calculateTotals();


        payBtn.disabled = true;

        payBtn.textContent =
            "CONNECTING TO PAYSTACK...";


        try {

            const response =
                await fetch(
                    "/api/paystack/initialize",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email,

                            amount: total,

                            customer: {
                                firstName,
                                lastName,
                                phone,
                                address,
                                city,
                                region
                            },

                            items: cart,

                            paymentMethod: payment

                        })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success ||
                !data.authorization_url
            ) {

                throw new Error(
                    data.message ||
                    "Unable to start payment."
                );

            }


            /*
             * Save the reference locally so we have
             * a backup reference during testing.
             */

            if (data.reference) {

                sessionStorage.setItem(
                    "99stepsPendingReference",
                    data.reference
                );

            }


            /*
             * Redirect customer to Paystack.
             */

            window.location.href =
                data.authorization_url;


        } catch (error) {

            console.error(
                "Payment error:",
                error
            );


            alert(
                error.message ||
                "Something went wrong while starting payment."
            );


            payBtn.disabled = false;

            payBtn.textContent =
                "FA SIKA NO BRA";

        }

    }


    /* ==========================================
       PAYMENT BUTTON
    ========================================== */

    payBtn?.addEventListener(
        "click",
        startPayment
    );


    /* ==========================================
       INITIAL LOAD
    ========================================== */

    (async () => {

        const returnedFromPaystack =
            await handlePaymentReturn();


        if (!returnedFromPaystack) {

            renderCheckout();

        }

    })();

});

</script>

</body>
</html>
